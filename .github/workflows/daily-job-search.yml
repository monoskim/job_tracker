name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Search for jobs
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_QUERY: ${{ vars.JOB_QUERY }}
          JOB_QUERIES: ${{ vars.JOB_QUERIES }}
          JOB_REMOTE_CLAUSE: ${{ vars.JOB_REMOTE_CLAUSE }}
          JOB_FIRST_HIRE_CLAUSE: ${{ vars.JOB_FIRST_HIRE_CLAUSE }}
          JOB_NO_EXISTING_TEAM_CLAUSE: ${{ vars.JOB_NO_EXISTING_TEAM_CLAUSE }}
          JOB_SEARCH_GL: ${{ vars.JOB_SEARCH_GL || 'us' }}
          JOB_SEARCH_HL: ${{ vars.JOB_SEARCH_HL || 'en' }}
        run: python search_jobs.py

      - name: Upload search output
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-search-results
          path: output/
          if-no-files-found: error
